<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Brook</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css?v=20261028" rel="stylesheet">
</head>
<body data-page="products">
<div class="container crumbs"><a href="index.html">Home</a><i class="bi bi-chevron-right"></i><span><span id="crumbCat">Products</span></span></div>
<main class="container page">
  <h1 class="page-title">Products <sup style="font-size:.4em;font-weight:300;color:var(--text)" id="count"></sup></h1>
  <div class="row g-5">
    <aside class="col-lg-3 side"><h4>Categories</h4><div id="cats"></div></aside>
    <div class="col-lg-9">
      <div class="toolbar">
        <div class="views" id="views"><button data-c="1" aria-label="List"><i class="bi bi-list"></i></button><button data-c="2" aria-label="2 columns"><i class="bi bi-grid"></i></button><button data-c="3" aria-label="3 columns"><i class="bi bi-grid-3x3-gap"></i></button><button class="on" data-c="4" aria-label="4 columns"><i class="bi bi-grid-3x3"></i></button></div>
        <label class="me-auto"><input type="checkbox" class="form-check-input me-2" id="sale">Show only products on sale</label>
        <div>Sort by <select id="sort"><option value="">Default</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option></select></div>
        <div>Show <select id="show"><option>50</option><option>24</option><option>12</option></select></div>
      </div>
      <div class="p-grid" id="grid"></div>
      <p id="empty" class="d-none">No products found.</p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/products.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
